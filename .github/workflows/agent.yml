name: agent

# The agent runs here, in public: every run's log is visible on the Actions tab.
on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours; pays whatever is due
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: status
        options: [status, run, dry-run, pay, register, set-uri, verify, self-link, self-status]
      arg:
        description: "Bill id for pay, agent.json URL for register or set-uri"
        type: string
        required: false

permissions:
  contents: write # the agent commits its ledger back to the repo

# Never two runs at once: the ledger is the agent's memory of what it has paid.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out main as it is now, not the commit that triggered the run. A run that waited
      # behind another must see the ledger that run saved, or it would pay the same bill again.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run agent
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          RPC_URL: ${{ vars.RPC_URL || 'https://forno.celo.org' }}
          GAS_IN_USDT: ${{ vars.GAS_IN_USDT || 'false' }}
          COMMAND: ${{ inputs.command || 'run' }}
          ARG: ${{ inputs.arg }}
        run: |
          case "$COMMAND" in
            dry-run) npm run --silent agent -- run --dry-run ;;
            *)       npm run --silent agent -- "$COMMAND" ${ARG:+"$ARG"} ;;
          esac

      - name: Commit ledger
        if: always()
        run: |
          if [ ! -d data ]; then echo "no ledger yet"; exit 0; fi
          # Copy the data into the public site too, so the page loads it from its own server.
          mkdir -p docs/data
          cp household.json docs/data/household.json
          for f in data/ledger.json data/identity.json; do
            if [ -f "$f" ]; then cp "$f" docs/data/; fi
          done
          # Write the figures into the page itself, so it reads right without JavaScript.
          npm run --silent agent -- render || echo "::warning::could not render the page; it still fills in with JavaScript"
          git add data docs/data docs/index.html
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git config user.name "ile-agent"
          git config user.email "ile-agent@users.noreply.github.com"
          git commit -m "ledger: ${{ inputs.command || 'scheduled run' }} ${{ github.run_id }}"
          # The ledger is the agent's memory of what it paid. Keep trying to save it. If someone else
          # changed it meanwhile, combine both copies so neither loses a payment; any other clash stops here.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase; then
              # The pull failed before a rebase started (a network error): wait and try again.
              if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ]; then sleep $((attempt * 10)); continue; fi
              others=$(git diff --name-only --diff-filter=U | grep -v -x -E 'data/ledger.json|docs/data/.*|docs/index.html' || true)
              if [ -n "$others" ]; then
                git rebase --abort
                echo "::error::the save clashed with changes outside the ledger: $others"
                exit 1
              fi
              if git ls-files -u -- data/ledger.json | grep -q .; then
                git show :2:data/ledger.json > "$RUNNER_TEMP/upstream.json"
                git show :3:data/ledger.json > "$RUNNER_TEMP/mine.json"
                npm run --silent agent -- merge-ledger "$RUNNER_TEMP/upstream.json" "$RUNNER_TEMP/mine.json"
              fi
              cp household.json docs/data/household.json
              for f in data/ledger.json data/identity.json; do
                if [ -f "$f" ]; then cp "$f" docs/data/; fi
              done
              # The page's figures come from the ledger: take main's page and write the merged figures into it.
              if git ls-files -u -- docs/index.html | grep -q .; then git checkout --ours docs/index.html; fi
              npm run --silent agent -- render || true
              git add data docs/data docs/index.html
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort
                echo "::error::could not combine the ledgers; check data/ledger.json before the next run"
                exit 1
              fi
            fi
            if git push; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::error::could not save the ledger after 5 attempts; check data/ledger.json before the next run"
          exit 1
