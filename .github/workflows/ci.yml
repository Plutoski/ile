name: ci
on:
  push:
    paths-ignore: ["data/**", "docs/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Rebuild every recorded payment from the chain: sender, attribution tag, amounts.
      - run: npm run verify
